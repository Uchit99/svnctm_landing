<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SVNCTM — Every Space, a Sanctum. A new feeling is taking shape."
    >

    <meta
        name="theme-color"
        content="#F7F5F2"
    >

    <!-- Browser, legacy, and Apple device icons -->
    <link rel="icon" href="favicon.ico?v=3" sizes="any">
    <link rel="icon" type="image/png" href="favicon-16.png?v=3" sizes="16x16">
    <link rel="icon" type="image/png" href="favicon-32.png?v=3" sizes="32x32">
    <link rel="icon" type="image/png" href="favicon2.png?v=3" sizes="192x192">
    <link rel="apple-touch-icon" href="favicon-180.png?v=3" sizes="180x180">
    <link rel="manifest" href="site.webmanifest?v=3">


    <title>SVNCTM — Every Space, a Sanctum.</title>


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================== -->

    <div
        class="loader"
        id="loader"
    >

        <div class="loader-content">

            <img
                src="logo/SVNCTM%20-%20Logo%20-%20Dusty%20Rose.png"
                alt="SVNCTM"
                class="loading-logo"
            >

            <div class="loader-line">

                <span></span>

            </div>

        </div>

    </div>



    <!-- =========================================
         ANIMATED BACKGROUND
    ========================================== -->

    <div class="background">

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="orb orb-four"></div>

    </div>


    <!-- FILM GRAIN -->

    <div class="grain"></div>



    <!-- =========================================
         MAIN WEBSITE
    ========================================== -->

    <main class="landing">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="top">


            <!-- REAL SVNCTM LOGO -->

            <a
                href="/"
                class="brand"
                aria-label="SVNCTM Home"
            >

                <img
                    src="logo/SVNCTM%20-%20Logo%20-%20Dusty%20Rose.png"
                    alt="SVNCTM"
                    class="header-logo"
                >

            </a>


          

        </header>



        <!-- =====================================
             HERO
        ====================================== -->

        <section class="center">

            <!-- EVERY SPACE, A SVNCTM -->

            <div class="coming-label">

                <span class="coming-pink">
                    EVERY SPACE, A SANCTUM
                </span>

            </div>



            <!-- MAIN TITLE -->

            <h1 class="main-title">


                <span class="title-line line-one">

                    COMING

                </span>


                <span class="title-line line-two">

                    SOON

                </span>


            </h1>



            <!-- DESCRIPTION -->

            <p class="message">

                A new feeling is taking shape.

            </p>


        </section>



        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="bottom">


            <!-- COPYRIGHT -->

            <div class="footer-left">

                <span class="copyright">

                    © 2026 House of Sanctum

                </span>

            </div>



            <!-- CONTACT LINKS -->

            <div class="footer-links">


                <!-- =================================
                     EMAIL
                ================================== -->

                <a
                    href="mailto:shubham@svnctm.com"
                    class="contact-link"
                    aria-label="Email SVNCTM"
                >

                    <svg
                        class="contact-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <rect
                            x="3"
                            y="5"
                            width="18"
                            height="14"
                            rx="2"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                        <path
                            d="M4 7L12 13L20 7"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                    </svg>


                    <span>
                        EMAIL
                    </span>

                </a>



                <!-- =================================
                     PHONE
                ================================== -->

                <a
                    href="tel:+91-9809407320"
                    class="contact-link"
                    aria-label="Contact SVNCTM"
                >

                    <svg
                        class="contact-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <path
                            d="M7 3.5L10 3L12 8L9.5 10C10.6 12.5 12.5 14.4 15 15.5L17 13L21 15L20.5 18C20.3 19.2 19.3 20 18.1 20C10.3 19.5 4.5 13.7 4 5.9C4 4.7 4.8 3.7 6 3.5Z"
                            stroke="currentColor"
                            stroke-width="1.5"
                            stroke-linejoin="round"
                        />

                    </svg>


                    <span>
                        CONTACT
                    </span>

                </a>



                <!-- =================================
                     INSTAGRAM
                ================================== -->

                <a
                    href="https://www.instagram.com/svnctm/"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="contact-link"
                    aria-label="Visit SVNCTM Instagram"
                >

                    <svg
                        class="contact-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                    >

                        <rect
                            x="3"
                            y="3"
                            width="18"
                            height="18"
                            rx="5"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                        <circle
                            cx="12"
                            cy="12"
                            r="4"
                            stroke="currentColor"
                            stroke-width="1.5"
                        />

                        <circle
                            cx="17.4"
                            cy="6.6"
                            r="1"
                            fill="currentColor"
                        />

                    </svg>


                    <span>
                        INSTAGRAM
                    </span>


                    <span class="arrow">
                        ↗
                    </span>

                </a>


            </div>


        </footer>


    </main>



    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>

</html>
