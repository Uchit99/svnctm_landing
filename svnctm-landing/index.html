<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="SVNCTM — Every Space, a Sanctum. Coming Soon."
    >

    <meta name="theme-color" content="#F7F5F2">

    <title>SVNCTM — Every Space, a Sanctum.</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ==============================
         LOADER
    =============================== -->

    <div class="loader" id="loader">

        <div class="loader-logo">
            SVNCTM
        </div>

        <div class="loader-line">
            <span></span>
        </div>

    </div>


    <!-- ==============================
         BACKGROUND
    =============================== -->

    <div class="background">

        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>

    </div>

    <div class="grain"></div>


    <!-- ==============================
         MAIN
    =============================== -->

    <main class="landing">

        <!-- TOP -->

        <header class="top">

            <div class="brand">
                SVNCTM
            </div>

            <div class="top-status">
                COMING SOON
            </div>

        </header>


        <!-- CENTER -->

        <section class="center">

            <div class="brand-small">
                SVNCTM
            </div>


            <h1 class="main-title">

                <span class="line line-one">
                    EVERY SPACE,
                </span>

                <span class="line line-two">
                    <span class="pink">
                        A SANCTUM.
                    </span>
                </span>

            </h1>


            <div class="coming">

                <span class="coming-line"></span>

                <span>
                    COMING SOON
                </span>

                <span class="coming-line"></span>

            </div>


            <p class="message">
                A new feeling is taking shape.
            </p>

        </section>


        <!-- ==============================
             BOTTOM
        =============================== -->

        <footer class="bottom">

            <span class="copyright">
                © 2026 SVNCTM
            </span>


            <!-- INSTAGRAM -->

            <a
                href="https://www.instagram.com/svnctm/"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram"
                aria-label="Visit SVNCTM on Instagram"
            >

                <!-- Instagram SVG Logo -->

                <svg
                    class="instagram-icon"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <!-- Outer rounded square -->

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />

                    <!-- Camera lens -->

                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />

                    <!-- Camera dot -->

                    <circle
                        cx="17.4"
                        cy="6.6"
                        r="1.15"
                        fill="currentColor"
                    />

                </svg>


                <span class="instagram-text">
                    @svnctm
                </span>


                <span class="instagram-arrow">
                    ↗
                </span>

            </a>

        </footer>

    </main>


    <script src="script.js"></script>

</body>
</html>
