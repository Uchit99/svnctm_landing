<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SVNCTM — Every Space, a Sanctum. A new feeling is taking shape."
    >

    <meta
        name="theme-color"
        content="#F7F5F2"
    >

    <!-- =========================================
         SVNCTM LOGO / BROWSER TAB ICON
    ========================================== -->

    <link
        rel="icon"
        type="image/png"
        href="logo/logo.png"
    >

    <link
        rel="shortcut icon"
        type="image/png"
        href="logo/logo.png"
    >

    <link
        rel="apple-touch-icon"
        href="logo/logo.png"
    >


    <title>SVNCTM — Every Space, a Sanctum.</title>


    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =========================================
         LOADING SCREEN
    ========================================== -->

    <div
        class="loader"
        id="loader"
    >

        <div class="loader-content">

            <!-- REAL SVNCTM LOGO -->

            <img
                src="logo/logo.png"
                alt="SVNCTM"
                class="loading-logo"
            >


            <div class="loader-line">

                <span></span>

            </div>

        </div>

    </div>



    <!-- =========================================
         BACKGROUND
    ========================================== -->

    <div class="background">

        <div class="orb orb-one"></div>

        <div class="orb orb-two"></div>

        <div class="orb orb-three"></div>

        <div class="orb orb-four"></div>

    </div>


    <!-- FILM GRAIN -->

    <div class="grain"></div>



    <!-- =========================================
         MAIN WEBSITE
    ========================================== -->

    <main class="landing">


        <!-- =====================================
             HEADER
        ====================================== -->

        <header class="top">


            <!-- REAL LOGO -->

            <a
                href="/"
                class="brand"
                aria-label="SVNCTM Home"
            >

                <img
                    src="logo/logo.png"
                    alt="SVNCTM"
                    class="header-logo"
                >

            </a>


            <div class="top-status">

                COMING SOON

            </div>


        </header>



        <!-- =====================================
             CENTER
        ====================================== -->

        <section class="center">


            <!-- NO SMALL SVNCTM TEXT HERE -->


            <h1 class="main-title">


                <span class="title-line line-one">

                    EVERY SPACE,

                </span>


                <span class="title-line line-two">

                    <span class="pink">

                        A SANCTUM.

                    </span>

                </span>


            </h1>



            <!-- COMING SOON -->

            <div class="coming">


                <span class="coming-line"></span>


                <span class="coming-text">

                    COMING SOON

                </span>


                <span class="coming-line"></span>


            </div>



            <!-- MESSAGE -->

            <p class="message">

                A new feeling is taking shape.

            </p>


        </section>



        <!-- =====================================
             FOOTER
        ====================================== -->

        <footer class="bottom">


            <span class="copyright">

                © 2026 SVNCTM

            </span>



            <!-- =================================
                 INSTAGRAM
            ================================== -->

            <a
                href="https://www.instagram.com/svnctm/"
                target="_blank"
                rel="noopener noreferrer"
                class="instagram"
                aria-label="Visit SVNCTM on Instagram"
            >


                <!-- INSTAGRAM SVG LOGO -->

                <svg
                    class="instagram-icon"
                    viewBox="0 0 24 24"
                    xmlns="http://www.w3.org/2000/svg"
                >

                    <rect
                        x="3"
                        y="3"
                        width="18"
                        height="18"
                        rx="5"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />


                    <circle
                        cx="12"
                        cy="12"
                        r="4"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="1.6"
                    />


                    <circle
                        cx="17.4"
                        cy="6.6"
                        r="1.15"
                        fill="currentColor"
                    />

                </svg>


                <span class="instagram-text">

                    @svnctm

                </span>


                <span class="instagram-arrow">

                    ↗

                </span>


            </a>


        </footer>


    </main>



    <script src="script.js"></script>

</body>

</html>
